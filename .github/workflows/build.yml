name: Build APK
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: ./gradlew assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk Galerie.apk
      - uses: actions/upload-artifact@v4
        with: { name: galerie-apk, path: Galerie.apk }
      - name: Lire la version
        id: v
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Publier la release
        uses: softprops/action-gh-release@v2
        with:
          files: Galerie.apk
          tag_name: v${{ steps.v.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Galerie ${{ steps.v.outputs.name }}
          make_latest: true
          body: |
            Galerie, application de galerie Android (Android 11+).
            Télécharger **Galerie.apk** ci-dessous, l'ouvrir sur le téléphone et autoriser l'installation.
